name: Independent Audit Anchor Transport MAS isolation
on:
  push:
    paths:
      - 'packages/network_anchor_transport/**'
      - '.github/workflows/network-anchor-transport-isolation.yml'
  pull_request:
    paths:
      - 'packages/network_anchor_transport/**'
      - '.github/workflows/network-anchor-transport-isolation.yml'
permissions:
  contents: read
jobs:
  anchor-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated Core and signed remote Anchor delivery
        run: node --test packages/network_anchor_transport/tests/*.test.mjs
