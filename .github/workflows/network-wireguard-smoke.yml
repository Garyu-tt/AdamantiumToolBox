name: WireGuard provider isolated MAS smoke
on:
  push:
    paths:
      - 'packages/network_wireguard/**'
      - '.github/workflows/network-wireguard-smoke.yml'
  pull_request:
    paths:
      - 'packages/network_wireguard/**'
      - '.github/workflows/network-wireguard-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/network_wireguard/tests/*.test.mjs
