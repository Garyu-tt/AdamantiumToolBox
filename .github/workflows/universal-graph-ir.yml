name: Universal Graph IR R01
on:
  push:
    paths:
      - 'apps/universal_graph/**'
      - 'tests/universal_graph_ir.test.mjs'
      - '.github/workflows/universal-graph-ir.yml'
  pull_request:
    paths:
      - 'apps/universal_graph/**'
      - 'tests/universal_graph_ir.test.mjs'
      - '.github/workflows/universal-graph-ir.yml'
permissions:
  contents: read
jobs:
  graph-ir:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/universal_graph/ir.mjs
      - run: node --check apps/universal_graph/composition.mjs
      - run: node --test tests/universal_graph_ir.test.mjs
