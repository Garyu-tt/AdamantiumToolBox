name: Public workspace R04 contract
on:
  pull_request:
    paths:
      - 'sdk/workspace-result.mjs'
      - 'tests/workspace_result.test.mjs'
      - 'standards/repository-sources/workspace-r04.md'
      - '.github/workflows/workspace-public-r04.yml'
  push:
    branches: [main, 'feat/workspace-public-contract-r04']
    paths:
      - 'sdk/workspace-result.mjs'
      - 'tests/workspace_result.test.mjs'
      - 'standards/repository-sources/workspace-r04.md'
      - '.github/workflows/workspace-public-r04.yml'
permissions:
  contents: read
jobs:
  client-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/workspace_result.test.mjs
