name: Adamantium AI Core Android source validation
on:
  pull_request:
    paths:
      - 'android/adamantium-ai-core/**'
      - '.github/workflows/android-ai-core.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and run JVM unit tests
        run: gradle -p android/adamantium-ai-core --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Publish debug APK for physical device testing
        uses: actions/upload-artifact@v4
        with:
          name: adamantium-ai-core-debug-apk
          path: android/adamantium-ai-core/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
