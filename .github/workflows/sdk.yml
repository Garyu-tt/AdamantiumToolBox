name: MAS SDK independence
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source budget
        run: python tools/check-size.py
      - name: Recursive MAS contract
        run: node tests/sdk_modules.test.mjs
      - name: Isolated Core and generated App
        run: node tests/sdk_scaffold.test.mjs
