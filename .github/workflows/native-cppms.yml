name: Native CppMicroServices registry integration
on:
  push:
    paths:
      - 'native/cppms-bootstrap/**'
      - 'native/common/**'
      - '.github/workflows/native-cppms.yml'
  pull_request:
    paths:
      - 'native/cppms-bootstrap/**'
      - 'native/common/**'
      - '.github/workflows/native-cppms.yml'
permissions:
  contents: read
jobs:
  cppms-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Fetch pinned CppMicroServices fork and its submodules
        run: |
          git clone --depth=1 --recursive --branch development https://github.com/Garyu-tt/CppMicroServices.git "$RUNNER_TEMP/cppms"
          test "$(git -C "$RUNNER_TEMP/cppms" rev-parse HEAD)" = "5131b48c034eb7d5340d5ca9c577c634633aa14b"
      - name: Build and install CppMicroServices
        run: |
          cmake -S "$RUNNER_TEMP/cppms" -B "$RUNNER_TEMP/cppms-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DUS_BUILD_TESTING=OFF -DUS_BUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cppms-install"
          cmake --build "$RUNNER_TEMP/cppms-build" --parallel 2
          cmake --install "$RUNNER_TEMP/cppms-build"
      - name: Compile native capability registry against installed CppMicroServices
        run: |
          cmake -S native/cppms-bootstrap -B build/native-cppms -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/cppms-install" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-cppms --parallel 2
      - name: Verify ServiceTracker add and revoke
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/cppms-install/lib
        run: ctest --test-dir build/native-cppms --output-on-failure
