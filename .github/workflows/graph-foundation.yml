name: Graph DNS / Noosphere / Composite / Firewall (isolated)
on:
  pull_request:
    paths:
      - 'apps/graph_dns/**'
      - 'apps/graph_firewall/**'
      - 'apps/nftables_preview/**'
      - 'apps/nftables_lab/**'
      - 'apps/rollback_watchdog/**'
      - 'apps/network_inventory/**'
      - 'apps/wireguard_graph/**'
      - 'apps/noosphere/**'
      - 'apps/composite/**'
      - 'tests/graph_*.test.mjs'
      - 'tools/noosphere_sqlite_export.py'
      - '.github/workflows/graph-foundation.yml'
  push:
    branches:
      - 'feat/graph-dns-readonly-foundation-20261119'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify standalone MAS manifests and source budgets
        run: |
          python tools/check-size.py
          node tools/mas-check.mjs
      - name: Verify pure graph logic and authenticated actions
        run: |
          node tests/graph_services.test.mjs
          node tests/graph_firewall.test.mjs
          node tests/graph_nftables.test.mjs
          node tests/graph_nftables_lab.test.mjs
          node tests/graph_nftables_rollback.test.mjs
          node tests/graph_watchdog_receipt.test.mjs
          node tests/graph_watchdog_journal.test.mjs
          node tests/graph_network_inventory.test.mjs
          node tests/graph_wireguard.test.mjs
          node tests/graph_transaction.test.mjs
          node tests/graph_network_links.test.mjs
          node tests/graph_http_smoke.test.mjs
      - name: Verify export script syntax
        run: python -m py_compile tools/noosphere_sqlite_export.py

  nftables-kernel-lab:
    name: Real nft syntax check in disposable Linux netns
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native nftables and iproute2 tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2
      - name: Validate in ephemeral namespace; assert zero kernel rule changes
        shell: bash
        run: |
          set -euo pipefail
          namespace="ada-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo ip netns add "$namespace"
          trap 'sudo ip netns del "$namespace"' EXIT
          before="$(sudo ip netns exec "$namespace" nft -j list ruleset)"
          nsroot="$(dirname "$(readlink -f "/run/netns/$namespace")")"
          sudo env ADA_NFT_LAB_NAMESPACE="$namespace" \
            ADA_NFT_LAB_NAMESPACE_ROOT="$nsroot" \
            ADA_NFT_LAB_NFT="$(command -v nft)" \
            ADA_NFT_LAB_IP="$(command -v ip)" \
            "$(command -v node)" tests/graph_nftables_real.test.mjs
          sudo env ADA_NFT_LAB_NAMESPACE="$namespace" \
            ADA_NFT_LAB_NAMESPACE_ROOT="$nsroot" \
            ADA_NFT_LAB_NFT="$(command -v nft)" \
            ADA_NFT_LAB_IP="$(command -v ip)" \
            ADA_NFT_LAB_DISPOSABLE_ONLY=1 \
            "$(command -v node)" tests/native/nftables_watchdog_real.test.mjs
          after="$(sudo ip netns exec "$namespace" nft -j list ruleset)"
          test "$before" = "$after"
          echo "NFTABLES_RULESET_UNCHANGED_OK"
