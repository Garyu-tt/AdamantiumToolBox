name: Public Runner R05a admission contract
on:
  pull_request:
    paths:
      - 'sdk/runner-admission-result.mjs'
      - 'tests/runner_admission_result.test.mjs'
      - 'standards/repository-sources/runner-admission-r05a.md'
      - '.github/workflows/runner-admission-public-r05a.yml'
  push:
    branches: [main, 'feat/runner-admission-public-r05a']
    paths:
      - 'sdk/runner-admission-result.mjs'
      - 'tests/runner_admission_result.test.mjs'
      - 'standards/repository-sources/runner-admission-r05a.md'
      - '.github/workflows/runner-admission-public-r05a.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/runner_admission_result.test.mjs
