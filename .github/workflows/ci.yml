name: Architecture and MAS validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: CPU-only validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static architecture checks
        run: |
          python tools/architecture-check.py
          python tests/architecture.test.py
          python tools/check-size.py
          node tools/mas-check.mjs
      - name: Isolated runtime and contract tests
        run: |
          set -eu
          for t in tests/*.test.mjs; do
            if [ "$t" = "tests/http.test.mjs" ]; then
              continue
            fi
            node "$t"
          done

  browser-windows:
    name: Chromium browser on Windows
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate client watchdog PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/windows-client-watchdog.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){throw ($errors | Out-String)}
      - name: Smoke test watchdog on Windows without starting any tasks
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'guardian-fixture'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $config = @{schema='mas-client-watchdog-config-1';pollIntervalSec=10;targets=@(
            @{id='missing_task';taskName='Fixture-MAS-Does-Not-Exist';autoStart=$false})}
          $config | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $dir 'config.json')
          & powershell.exe -NoProfile -File 'tools/windows-client-watchdog.ps1' -ConfigPath (Join-Path $dir 'config.json') -Once
          if($LASTEXITCODE -ne 0){throw 'Guardian fixture failed'}
          $state = Get-Content (Join-Path $dir 'status.json') -Raw | ConvertFrom-Json
          if($state.targets[0].reason -ne 'task_missing'){throw 'Expected missing task report'}
          & powershell.exe -NoProfile -File 'tools/windows-client-watchdog.ps1' -ConfigPath (Join-Path $dir 'config.json') -Once
          $state = Get-Content (Join-Path $dir 'status.json') -Raw | ConvertFrom-Json
          if($state.targets[0].failures -ne 2){throw 'Persisted failure counter was not restored'}
      - name: Run real Chromium CDP tests
        env:
          MAS_BROWSER_REQUIRE_ENGINE: '1'
        run: |
          node tests/browser.test.mjs
          node tests/browser_lease.test.mjs
          node tests/browser_continuity.test.mjs
          node tests/browser_handoff.test.mjs
          node tests/browser_relay.test.mjs
          node tests/browser_provider_cli.test.mjs
          node tests/window_geometry.test.mjs
          node tests/window_ui.test.mjs
          node tests/isolation.test.mjs
