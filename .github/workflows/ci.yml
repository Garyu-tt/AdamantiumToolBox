name: Architecture and MAS validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: CPU-only validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static architecture checks
        run: |
          python tools/architecture-check.py
          python tests/architecture.test.py
          python tools/check-size.py
          node tools/mas-check.mjs
      - name: Isolated runtime and contract tests
        run: |
          set -eu
          for t in tests/*.test.mjs; do
            if [ "$t" = "tests/http.test.mjs" ]; then
              continue
            fi
            node "$t"
          done

  browser-windows:
    name: Chromium browser on Windows
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real Chromium CDP tests
        env:
          MAS_BROWSER_REQUIRE_ENGINE: '1'
        run: |
          node tests/browser.test.mjs
          node tests/browser_lease.test.mjs
          node tests/browser_continuity.test.mjs
          node tests/browser_handoff.test.mjs
          node tests/browser_relay.test.mjs
          node tests/browser_provider_cli.test.mjs
          node tests/window_geometry.test.mjs
          node tests/window_ui.test.mjs
          node tests/isolation.test.mjs

  gauntlet-evidence:
    name: Independent Gauntlet evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute QA scripts and preserve real logs
        env:
          GAUNTLET_EVIDENCE_PATH: ${{ runner.temp }}/gauntlet-evidence.json
        run: |
          node tools/gauntlet-ci-evidence.mjs \
            tests/gauntlet.test.mjs \
            tests/gauntlet_failures.test.mjs \
            tests/gauntlet_live_graph.test.mjs \
            tests/gauntlet_ci_evidence.test.mjs
      - name: Publish immutable evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gauntlet-evidence.json
          if-no-files-found: error
