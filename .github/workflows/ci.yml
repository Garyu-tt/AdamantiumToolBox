name: Architecture and MAS validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: CPU-only validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static architecture checks
        run: |
          python tools/architecture-check.py
          python tests/architecture.test.py
          python tools/check-size.py
          node tools/mas-check.mjs
      - name: Mikoshi acoustic and online-prosody unit tests
        run: |
          node tests/mikoshi_speech.test.mjs
          node tests/mikoshi_prosody.test.mjs
          node tests/mikoshi_piper.test.mjs
          node tests/mikoshi_phonetics.test.mjs
          node tests/mikoshi_phonetics_service.test.mjs
          node tests/mikoshi_microphone.test.mjs
          node tests/mikoshi_motifs.test.mjs
          node tests/mikoshi_motifs_service.test.mjs
          node tests/mikoshi_sequences.test.mjs
          node tests/mikoshi_sequences_service.test.mjs
          node tests/mikoshi_hearing_sequence_integration.test.mjs
          node tests/mikoshi_motorlinks.test.mjs
          node tests/mikoshi_motorlinks_service.test.mjs
          node tests/mikoshi_gestures.test.mjs
          node tests/mikoshi_vocalstream.test.mjs
          node tests/mikoshi_gesture_runtime.test.mjs
          node tests/mikoshi_transition_feedback.test.mjs
          node tests/mikoshi_transition_service.test.mjs
          node tests/mikoshi_complete_loop.test.mjs
          node tests/mikoshi_live_loop.test.mjs
          node tests/mikoshi_segments.test.mjs
          node tests/mikoshi_segments_service.test.mjs
          node tests/mikoshi_stream_imitation.test.mjs
          node tests/mikoshi_explorer.test.mjs
          node tests/mikoshi_explorer_service.test.mjs
          node tests/mikoshi_explorer_live.test.mjs
          node tests/mikoshi_worldmodel.test.mjs
          node tests/mikoshi_worldmodel_service.test.mjs
          node tests/mikoshi_hypotheses.test.mjs
          node tests/mikoshi_hypotheses_live.test.mjs
          node tests/mikoshi_vision.test.mjs
          node tests/mikoshi_grounding.test.mjs
          node tests/mikoshi_av_live.test.mjs
          node tests/mikoshi_avsync.test.mjs
          node tests/mikoshi_avsync_live.test.mjs
          node tests/mikoshi_av_capture.test.mjs
          node tests/mikoshi_tracking.test.mjs
          node tests/mikoshi_sourcepolicy.test.mjs
          node tests/mikoshi_clockcal.test.mjs
          node tests/mikoshi_r15_live.test.mjs
          node tests/mikoshi_av_policy.test.mjs
          node tests/mikoshi_av_gate_view.test.mjs
          node tests/mikoshi_r16_secure_writes.test.mjs
          node tests/mikoshi_permit_contract.test.mjs
          node tests/mikoshi_r16_permit_expiry.test.mjs
      - name: Isolated runtime and contract tests
        run: |
          set -eu
          for t in tests/*.test.mjs; do
            if [ "$t" = "tests/http.test.mjs" ]; then
              continue
            fi
            node "$t"
          done

  browser-windows:
    name: Chromium browser on Windows
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real Chromium CDP tests
        env:
          MAS_BROWSER_REQUIRE_ENGINE: '1'
        run: |
          node tests/browser.test.mjs
          node tests/browser_lease.test.mjs
          node tests/browser_continuity.test.mjs
          node tests/browser_handoff.test.mjs
          node tests/browser_relay.test.mjs
          node tests/browser_provider_cli.test.mjs
          node tests/window_geometry.test.mjs
          node tests/window_ui.test.mjs
          node tests/isolation.test.mjs
