name: Mechanicus Math Lab R01–R03 — exact research experiments
on:
  pull_request:
    paths:
      - 'apps/math_lab/**'
      - 'tests/math_lab*.test.mjs'
      - 'tools/math-lab-reproduce.mjs'
      - 'tools/math-lab-benchmark.mjs'
      - 'docs/MATH-LAB-R01.md'
      - '.github/workflows/math-lab.yml'
  push:
    branches:
      - research/mechanicus-math-lab-r01
      - research/mechanicus-math-lab-r02-graph
      - research/mechanicus-math-lab-r03-op-ids
    paths:
      - 'apps/math_lab/**'
      - 'tests/math_lab*.test.mjs'
      - '.github/workflows/math-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math-lab-r01:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and bounded lossless research engine
        run: |
          node --check apps/math_lab/root_transform.mjs
          node --check apps/math_lab/experiment.mjs
          node --check apps/math_lab/service.mjs
          node --check apps/math_lab/view.js
          node --check apps/math_lab/transform_graph.mjs
          node --check apps/math_lab/reference_verify.mjs
          node --check apps/math_lab/operation_registry.mjs
          node --check apps/math_lab/operation_kernels.mjs
          node --check apps/math_lab/operation_graph_codec.mjs
          node --check tools/math-lab-reproduce.mjs
          node --check tools/math-lab-benchmark.mjs
          node --test tests/math_lab.test.mjs tests/math_lab_graph.test.mjs tests/math_lab_operations.test.mjs tests/math_lab_benchmark.test.mjs tests/math_lab_service.test.mjs
          node tools/math-lab-benchmark.mjs
